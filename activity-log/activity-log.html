<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Link log</title>
    <link rel="stylesheet" href="../lib/ui-theme.css" />
    <link rel="stylesheet" href="activity-log.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Link log</h1>
      <input
        id="log-search"
        class="log-search"
        type="search"
        placeholder="Filter"
        autocomplete="off"
      />
      <button id="clear-log-btn" type="button">Clear</button>
    </header>
    <div id="activity-log" class="activity-log"></div>
    <script type="module" src="activity-log.js"></script>
  </body>
</html>
