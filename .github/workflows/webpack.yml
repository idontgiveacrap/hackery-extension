name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm

    - name: Pack extension
      run: |
        npm ci
        npm run pack

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: extension-dist
        path: dist
